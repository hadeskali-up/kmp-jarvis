name: Build KMP Jarvis APK + GitHub Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmp-jarvis-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Rename APK for release
        run: |
          APK_PATH=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK_PATH" ./kmp-jarvis.apk
          echo "APK prepared: $(ls -lh ./kmp-jarvis.apk)"

      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M')"
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest ./kmp-jarvis.apk \
            --title "Jarvis — Latest Build" \
            --notes "Built from commit ${{ github.sha }} on $(date +'%Y-%m-%d %H:%M UTC')" \
            --prerelease
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/latest"
